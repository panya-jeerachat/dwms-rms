     ข้อมูลสาธารณะใช้รูปแบบ /macros/s/<ID>/exec เสมอ เพราะรูปแบบ /a/msu.ac.th/... บังคับล็อกอินบัญชีมหาวิทยาลัย
     ผู้เข้าชมทั่วไปจึงโหลดข้อมูลไม่ได้ ส่วนปุ่มผู้ดูแลใช้รูปแบบโดเมน msu.ac.th ให้เลือกบัญชีมหาวิทยาลัยอัตโนมัติ */

  ADMIN_DOMAIN: 'msu.ac.th',
  /* URL ของ Deployment สำหรับ SSO (Who has access: เฉพาะใน msu.ac.th) — เว้นว่าง = ใช้ Deployment เดิม */

  CACHE_KEY: 'rms_profile_cache_v2',
  TIMEOUT_MS: 15000
};
(function(){
  var m = String(CONFIG.API).match(/\/s\/([\w-]+)\/exec/);
  CONFIG.ID = m ? m[1] : '';
  CONFIG.API = CONFIG.ID ? 'https://script.google.com/macros/s/' + CONFIG.ID + '/exec' : CONFIG.API;
  CONFIG.ADMIN = /^https:\/\/script\.google\.com\/.+\/exec$/.test(CONFIG.ADMIN_URL) ? CONFIG.ADMIN_URL
    : (CONFIG.ID ? 'https://script.google.com/a/macros/' + CONFIG.ADMIN_DOMAIN + '/s/' + CONFIG.ID + '/exec' : CONFIG.API);

/* เริ่มขอข้อมูลทันทีตั้งแต่ส่วนหัวของหน้า ไม่ต้องรอโหลดหน้าเสร็จ (ประหยัดเวลาได้ราว 0.3–1 วินาที) */

<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0D2B5C; --blue:#1565C0; --blue-2:#E8F0FB; --paper:#F4F7FB; --ink:#172234; --mute:#5E6B80; --line:#D9E1EC; --white:#fff;
  --t1:#0B7A5B; --t2:#1565C0; --sc:#6B3FA0; --pr:#A4521B; --oth:#5E6B80;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;overflow-x:clip}
body{font-family:'Sarabun',Tahoma,sans-serif;background:var(--paper);color:var(--ink);font-size:16px;line-height:1.6}
h1,h2,h3,.num{font-family:'Kanit','Sarabun',sans-serif;font-weight:500;line-height:1.3}
a{color:var(--blue)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid #7FB0F0;outline-offset:2px;border-radius:4px}
img{max-width:100%}
@media (max-width:760px){input,select{font-size:16px!important}}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* แถบบน */
.top{background:var(--white);border-bottom:3px solid var(--navy);position:sticky;top:0;z-index:20}
.top-in{width:100%;padding:10px clamp(12px,2vw,32px);display:flex;align-items:center;gap:14px}
.top img{height:44px;width:auto}
.top .sep{width:1px;height:34px;background:var(--line)}
.top .name{flex:1;min-width:0}
.top .name b{font-family:'Kanit';font-weight:500;font-size:16px;display:block}
.top .name span{font-size:12.5px;color:var(--mute)}
.top .act{display:flex;gap:8px}
.top .act button,.top .act a{border:1px solid var(--line);background:var(--white);color:var(--ink);border-radius:8px;padding:7px 12px;font-size:14px;text-decoration:none}
.top .act button:hover,.top .act a:hover{border-color:var(--blue);color:var(--blue)}
.top .act{align-items:center}
.top .act .admin{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600;display:inline-flex;align-items:center;gap:7px;padding:8px 15px}
.top .act .admin:hover{background:var(--blue);border-color:var(--blue);color:#fff}
.top .act .admin svg{width:16px;height:16px}
.top .act .vsep{width:1px;height:26px;background:var(--line);margin:0 4px}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mute);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:#C5CEDB;display:inline-block}
.sync.live i{background:var(--t1)}
.sync.busy i{background:var(--blue);animation:pulse 1s infinite alternate}
.sync.off i{background:#D9A400}
@keyframes pulse{to{opacity:.25}}
@media(max-width:900px){.sync .txt{display:none}}
@media(max-width:640px){.top .sep,.top .name span,.top .act .vsep{display:none}.top .act .lbl{display:none}.top .act .admin{padding:8px 11px}}

/* โครง */
.wrap{width:100%;padding:20px clamp(12px,2vw,32px) 36px;display:grid;grid-template-columns:clamp(300px,22vw,380px) minmax(0,1fr);gap:clamp(16px,1.6vw,28px);align-items:start}
@media(max-width:980px){.wrap{grid-template-columns:1fr}}

/* การ์ดประวัติ */
.me{background:var(--white);border:1px solid var(--line);border-radius:14px;overflow:hidden;position:sticky;top:84px}
@media(max-width:980px){.me{position:static}}
.me-hd{padding:24px 22px 18px;text-align:center;border-bottom:1px solid var(--line)}
.ph{width:118px;height:118px;border-radius:50%;margin:0 auto 12px;object-fit:cover;border:4px solid var(--blue-2);background:var(--blue-2);display:grid;place-items:center;font-family:'Kanit';font-size:44px;color:var(--navy)}
.me h1{font-size:21px;color:var(--navy)}
.me .en{font-size:13.5px;color:var(--mute)}
.me .pos{margin-top:8px;font-size:15px}
.me .role{display:inline-block;margin-top:6px;background:var(--navy);color:#fff;font-size:13px;padding:3px 12px;border-radius:6px}
.me .unit{font-size:13.5px;color:var(--mute);margin-top:6px}

.strip-box{padding:16px 22px;border-bottom:1px solid var(--line)}
.strip-box h2{font-size:14px;color:var(--mute);font-family:'Sarabun';font-weight:600;margin-bottom:8px}
.strip{display:flex;gap:4px;flex-wrap:wrap}
.blk{width:22px;height:22px;border-radius:4px;border:2px solid currentColor;background:currentColor;display:inline-block}
.blk.wip{background:transparent;border-style:dashed}
.blk.t1{color:var(--t1)}.blk.t2{color:var(--t2)}.blk.sc{color:var(--sc)}.blk.pr{color:var(--pr)}.blk.oth{color:var(--oth)}
.strip-sum{font-size:14px;margin-top:8px}
.strip-sum b{font-family:'Kanit';font-weight:500;font-size:18px}

.me-bd{padding:16px 22px 20px;font-size:14.5px}
.me-bd dt{font-size:12.5px;color:var(--mute);margin-top:10px}
.me-bd dt:first-child{margin-top:0}
.me-bd dd{word-break:break-word}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tags span{background:var(--blue-2);color:var(--navy);font-size:13px;padding:2px 10px;border-radius:6px}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.links a{font-size:13.5px;border:1px solid var(--line);border-radius:7px;padding:4px 10px;text-decoration:none;display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.links a svg{width:15px;height:15px;flex:none}
.links a:hover{border-color:var(--blue)}

/* แท็บ */
.panel{background:var(--white);border:1px solid var(--line);border-radius:14px;min-width:0}
.tabs{display:flex;gap:2px;padding:6px 10px 0;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:11px 13px;color:var(--mute);white-space:nowrap;font-size:15px}
.tabs button[aria-selected="true"]{color:var(--navy);border-color:var(--blue);font-weight:600}
.tabs button .c{font-size:12px;background:var(--paper);border-radius:10px;padding:0 7px;margin-left:5px;color:var(--mute)}
.sec{padding:22px}
.sec h2{font-size:19px;color:var(--navy);margin-bottom:4px}
.sec .lead{color:var(--mute);font-size:14px;margin-bottom:16px}
.sub{margin-top:28px}
.ov-top{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:28px 40px;align-items:start}
.ov-top>.sub{margin-top:0}

/* ตารางสรุป */
.ledger{width:100%;border-collapse:collapse;font-size:15px}
.ledger th,.ledger td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:right}
.ledger th:first-child,.ledger td:first-child{text-align:left}
.ledger thead th{font-size:13px;color:var(--mute);font-weight:600;background:#F7F9FC}
.ledger td.n{font-family:'Kanit';font-size:17px}
.ledger tfoot td{font-weight:700;border-bottom:0;border-top:2px solid var(--navy)}
.ledger .dot{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:8px;vertical-align:-1px}
.tbl{overflow-x:auto}
.ledger th{white-space:nowrap}
.ledger td:first-child{padding-left:8px}
@media(max-width:600px){.ledger th,.ledger td{padding:9px 6px}.ledger{font-size:14px}.ledger thead th{font-size:12px}.sec{padding:18px 14px}}

/* กราฟบล็อก */
.chart{display:flex;align-items:flex-end;gap:18px;overflow-x:auto;padding:8px 2px 4px;min-height:160px;border-bottom:2px solid var(--ink)}
.col{display:flex;flex-direction:column-reverse;gap:5px;align-items:center;flex:1 1 0;min-width:54px;max-width:130px}
.col .blk{width:min(100%,72px);height:26px;border-radius:5px;cursor:default}
.col .blk:hover,.col .blk:focus{outline:2px solid var(--ink);outline-offset:1px}
.xax{display:flex;gap:18px;padding:6px 2px 0;overflow-x:hidden}
.xax span{flex:1 1 0;min-width:54px;max-width:130px;text-align:center;font-size:13px;color:var(--mute)}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;font-size:13.5px;color:var(--mute)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .blk{width:14px;height:14px;border-width:2px}

/* รายการผลงาน */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.filters input{flex:1;min-width:200px;padding:9px 12px;border:1px solid var(--line);border-radius:9px}
.chip{border:1px solid var(--line);background:var(--white);border-radius:20px;padding:6px 13px;font-size:14px;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,560px),1fr));column-gap:36px}
.it{display:grid;grid-template-columns:6px 1fr;gap:16px;padding:16px 0;border-top:1px solid var(--line)}
.it{border-top:1px solid var(--line)}
.it .rule{border-radius:3px;background:var(--oth)}
.it .rule.t1{background:var(--t1)}.it .rule.t2{background:var(--t2)}.it .rule.sc{background:var(--sc)}.it .rule.pr{background:var(--pr)}
.it .rule.wip{background:repeating-linear-gradient(180deg,var(--c,#8A97AB) 0 6px,transparent 6px 10px)}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:5px;font-size:12.5px}
.badges span{padding:1px 9px;border-radius:5px;background:var(--paper);color:var(--mute);font-weight:600}
.badges .lv{color:#fff;background:var(--oth)}
.badges .lv.t1{background:var(--t1)}.badges .lv.t2{background:var(--t2)}.badges .lv.sc{background:var(--sc)}.badges .lv.pr{background:var(--pr)}
.badges .st.ok{background:#E3F4EE;color:var(--t1)}
.badges .st.wip{background:#FFF4DE;color:#8A5A00}
.it h3{max-width:90ch;font-size:16.5px;font-family:'Sarabun';font-weight:700;line-height:1.45}
.it .en{color:var(--mute);font-size:14.5px;font-style:italic}
.it .au{font-size:14.5px;margin-top:3px}
.it .src{font-size:14.5px;color:var(--mute)}
.it .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.it .acts a,.it .acts button{font-size:13.5px;border:1px solid var(--line);background:var(--white);color:var(--blue);border-radius:7px;padding:4px 11px;text-decoration:none}
.it .acts a:hover,.it .acts button:hover{border-color:var(--blue)}
.evp{margin-top:10px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#FAFCFE;font-size:14px;max-width:900px}
.evp .hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:600}
.evp .ok{background:#E3F4EE;color:var(--t1);font-size:12px;border-radius:6px;padding:1px 8px}
.evp ul{list-style:none;margin-top:6px}
.evp li{padding:4px 0;border-top:1px dashed var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}
.evp li:first-child{border-top:0}
.evp .sc{font-size:11.5px;font-weight:700;border-radius:5px;padding:0 7px;background:var(--blue-2);color:var(--t2);flex:none}
.evp .sc.out{background:#EFE7F8;color:var(--sc)}
.evp small{color:var(--mute)}
.it details{margin-top:8px;font-size:14.5px}
.it summary{cursor:pointer;color:var(--mute)}
.it details p{margin-top:6px;max-width:75ch}
.empty{padding:28px;text-align:center;color:var(--mute)}

.cv-list{list-style:none;font-size:15px}
.cv-list li{padding:8px 0;border-top:1px solid var(--line)}
.cv-list li:first-child{border-top:0}
.prose{max-width:72ch;white-space:pre-line}

/* ───── รายละเอียดผลงาน (ป๊อปอัป) ───── */
.it h3 a{color:inherit;text-decoration:none}
.it h3 a:hover{color:var(--blue);text-decoration:underline}
.it .acts .more{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:600}
.it .acts .more:hover{background:var(--blue);border-color:var(--blue)}
body.dlg-open{overflow:hidden}
.dlg{position:fixed;inset:0;z-index:60;background:rgba(13,43,92,.5);display:flex;align-items:flex-start;justify-content:center;padding:28px 16px;overflow:auto}
.dlg[hidden]{display:none!important}
.dlg-box{background:#fff;border-radius:16px;width:min(980px,100%);box-shadow:0 30px 80px rgba(13,43,92,.3);position:relative;outline:none}
.dlg-hd{padding:22px 64px 18px 26px;border-bottom:1px solid var(--line);position:relative}
.dlg-hd .rule{position:absolute;left:0;top:22px;bottom:18px;width:5px;border-radius:0 4px 4px 0}
.dlg-hd h2{font-size:21px;color:var(--ink);font-family:'Sarabun';font-weight:700;line-height:1.45;margin-top:6px}
.dlg-hd .en{color:var(--mute);font-style:italic;margin-top:2px}
.dlg-x{position:absolute;right:16px;top:16px;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:22px;line-height:1;color:var(--mute)}
.dlg-x:hover{color:var(--ink);border-color:var(--ink)}
.dlg-bd{padding:6px 26px 10px}
.dsec{padding:18px 0;border-bottom:1px solid var(--line)}
.dsec:last-child{border-bottom:0}
.dsec h3{font-family:'Kanit';font-weight:500;font-size:16px;color:var(--navy);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.dsec h3 .n{font-family:'Sarabun';font-size:12.5px;color:var(--mute);font-weight:600;background:var(--paper);border-radius:10px;padding:0 8px}
.kvg{display:grid;grid-template-columns:190px 1fr;gap:7px 16px;font-size:15px}
.kvg dt{color:var(--mute)}
.kvg dd{min-width:0;word-break:break-word}
@media(max-width:640px){.kvg{grid-template-columns:1fr;gap:0}.kvg dd{margin-bottom:8px}}
.abs{white-space:pre-line;line-height:1.75;max-width:80ch}
.kw{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.kw span{background:var(--blue-2);color:var(--navy);font-size:13px;border-radius:6px;padding:2px 10px}
.docs{display:flex;flex-direction:column;gap:10px}
.doc{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.doc.main{border-color:#9DB8DE;background:#F7FAFE}
.doc-row{display:flex;gap:12px;align-items:center;padding:11px 14px;flex-wrap:wrap}
.doc-ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;flex:none;letter-spacing:.3px}
.doc-tx{flex:1;min-width:180px}
.doc-tx b{display:block;font-size:14.5px;word-break:break-word}
.doc-tx small{color:var(--mute);font-size:12.5px}
.doc-act{display:flex;gap:6px;flex-wrap:wrap}
.doc-act a,.doc-act button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;font-size:13.5px;color:var(--blue);text-decoration:none;white-space:nowrap}
.doc-act a:hover,.doc-act button:hover{border-color:var(--blue)}
.doc-act button[aria-expanded="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.pv{border-top:1px solid var(--line);background:#EEF2F7}
.pv iframe{display:block;width:100%;height:min(72vh,760px);border:0;background:#fff}
.pv img{display:block;max-width:100%;max-height:72vh;margin:0 auto}
.pv .hint{font-size:12.5px;color:var(--mute);padding:6px 14px;background:#fff;border-top:1px solid var(--line)}
.crit{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.crit span{font-size:13px;font-weight:600;border-radius:20px;padding:3px 12px;border:1px solid}
.crit .y{background:#E3F4EE;border-color:#B8E2D1;color:var(--t1)}
.crit .n{background:#FFF6E5;border-color:#F3D9A4;color:#8A5A00}
.evt{width:100%;border-collapse:collapse;font-size:14px}
.evt th,.evt td{border-bottom:1px solid var(--line);padding:9px 10px;text-align:left;vertical-align:top}
.evt th{background:#F7F9FC;color:var(--mute);font-size:12.5px;font-weight:600;white-space:nowrap}
.evt .sc{font-size:11.5px;font-weight:700;border-radius:5px;padding:1px 7px;background:var(--blue-2);color:var(--t2);white-space:nowrap}
.evt .sc.out{background:#EFE7F8;color:var(--sc)}
.evt .pvrow td{padding:0;border-bottom:1px solid var(--line)}

<script>
var LEVEL_ORDER = ['TCI กลุ่ม 1','TCI กลุ่ม 2','Scopus/ISI','Proceedings ระดับชาติ','Proceedings ระดับนานาชาติ','ระดับคณะ/มหาวิทยาลัย','อื่น ๆ'];
var LEVEL_CLS = {'TCI กลุ่ม 1':'t1','TCI กลุ่ม 2':'t2','Scopus/ISI':'sc','Proceedings ระดับชาติ':'pr','Proceedings ระดับนานาชาติ':'pr'};
var LEVEL_COLOR = {t1:'#0B7A5B',t2:'#1565C0',sc:'#6B3FA0',pr:'#A4521B',oth:'#5E6B80'};
var DONE = ['ตีพิมพ์แล้ว','เสร็จสิ้น','เผยแพร่แล้ว','ได้รับรางวัล'];
var TABS = [
  {id:'overview', name:'ภาพรวม'},
  /* done = ชื่อปุ่มกรอง "เสร็จแล้ว" ของแต่ละหมวด (คู่มือ/ผลงานเชิงวิเคราะห์ไม่มีการตีพิมพ์ จึงใช้คำว่าเผยแพร่) */
  {id:'publications', name:'ผลงานตีพิมพ์', cats:['ผลงานตีพิมพ์'], done:'ตีพิมพ์แล้ว'},
  {id:'presentations', name:'การนำเสนอ', cats:['การนำเสนอ'], done:'นำเสนอแล้ว'},
  {id:'innovation', name:'นวัตกรรม/รางวัล', cats:['R2R/นวัตกรรม','รางวัล','โครงการวิจัย'], done:'เสร็จสิ้น/ได้รับรางวัล'},
  {id:'manuals', name:'คู่มือและผลงานเชิงวิเคราะห์', cats:['คู่มือปฏิบัติงาน','ผลงานเชิงวิเคราะห์'], done:'เสร็จสิ้น/เผยแพร่แล้ว'},
  {id:'cv', name:'ประวัติ'}
];
var D = null, OWNER_RX = null, FILTER = {};

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];}); }
function safeUrl(u){ u=String(u||'').trim(); return /^https?:\/\//i.test(u)?u:''; }
function cls(w){ return LEVEL_CLS[w.level]||'oth'; }
function isDone(w){ return DONE.indexOf(w.status)>=0; }
function toast(t){ var e=$('toast'); e.textContent=t; e.classList.add('on'); clearTimeout(e._h); e._h=setTimeout(function(){e.classList.remove('on');},2400); }
function pageUrl(){ return location.href.split('#')[0]; }
function thDate(iso){ var d=new Date(iso); if(isNaN(d)) return '-';
  return d.toLocaleDateString('th-TH',{day:'numeric',month:'long',year:'numeric'})+' เวลา '+d.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})+' น.'; }

/* ───── โหลดข้อมูล ─────
   1) มีข้อมูลที่จำไว้ในเครื่อง → แสดงทันที (เปิดครั้งที่ 2 เป็นต้นไปไม่ต้องรอ) แล้วอัปเดตเบื้องหลัง
   2) ไม่มี → แสดงโครงร่างหน้า ระหว่างรอคำขอที่เริ่มไว้ตั้งแต่ส่วนหัว
   3) fetch ไม่สำเร็จ/ช้าเกิน → ลองทาง JSONP → ถ้ายังไม่ได้ แสดงข้อมูลที่จำไว้ หรือปุ่มลองใหม่ */
var SHOWN_SIG='';
function setSync(state,text){
  var el=$('sync'); if(!el) return;
  el.hidden=false; el.className='sync '+state; el.querySelector('.txt').textContent=text; el.title=text;
}
function readCache(){ try{ var j=JSON.parse(localStorage.getItem(CONFIG.CACHE_KEY)||'null'); return j&&j.ok?j:null; }catch(e){ return null; } }
function sig(j){ return JSON.stringify([j.profile,j.works]); }
function load(fresh){
  var cached=fresh?null:readCache();
  if(cached){ render(cached); SHOWN_SIG=sig(cached); setSync('busy','กำลังตรวจข้อมูลล่าสุด…'); }
  else slowHints();
  var req=(!fresh&&window.RMS_REQ)||requestFresh();
  window.RMS_REQ=null;
  req.then(got).catch(function(){ jsonp(CONFIG.API+'?page=data',got,failed); });
}
function requestFresh(){
  var ctl=window.AbortController?new AbortController():null;
  var t=ctl?setTimeout(function(){ctl.abort();},CONFIG.TIMEOUT_MS):0;
  return fetch(CONFIG.API+'?page=data&_='+Date.now(),{cache:'no-store',redirect:'follow',credentials:'omit',signal:ctl?ctl.signal:undefined})
    .then(function(r){ clearTimeout(t); if(!r.ok) throw 0; return r.json(); });
}
function slowHints(){
  var steps=[[3500,'กำลังเชื่อมต่อฐานข้อมูลผลงาน… การเปิดครั้งแรกอาจใช้เวลาสักครู่'],[9000,'ยังโหลดอยู่ เครือข่ายอาจช้ากว่าปกติ']];
  steps.forEach(function(st){ setTimeout(function(){ var n=$('skNote'); if(n) n.textContent=st[1]; },st[0]); });
}
function jsonp(url,ok,fail){
  var cb='rmsCB_'+Math.random().toString(36).slice(2), s=document.createElement('script'), done=false;
  var t=setTimeout(function(){ if(!done){done=true;clean();fail();} },12000);
  function clean(){ try{delete window[cb];}catch(e){window[cb]=undefined;} if(s.parentNode) s.parentNode.removeChild(s); clearTimeout(t); }
  window[cb]=function(j){ if(done) return; done=true; clean(); ok(j); };
  s.onerror=function(){ if(!done){done=true;clean();fail();} };
  s.src=url+'&callback='+cb+'&_='+Date.now();
  document.body.appendChild(s);
}
function got(j){
  if(!j||!j.ok){ failed(); return; }
  try{ localStorage.setItem(CONFIG.CACHE_KEY,JSON.stringify(j)); }catch(e){}
  var nsig=sig(j);
  if(nsig!==SHOWN_SIG){ var y=window.scrollY; render(j); SHOWN_SIG=nsig; window.scrollTo(0,y); }
  else { D.generated=j.generated; }
  setSync('live','ข้อมูลล่าสุด');
  setTimeout(function(){ var el=$('sync'); if(el&&el.classList.contains('live')) el.hidden=true; },4000);
}
function failed(){
  if(D){ setSync('off','แสดงข้อมูลที่บันทึกไว้ · เชื่อมต่อไม่ได้ชั่วคราว'); return; }
  var c=readCache();
  if(c){ render(c); SHOWN_SIG=sig(c); setSync('off','แสดงข้อมูลที่บันทึกไว้ · เชื่อมต่อไม่ได้ชั่วคราว'); return; }
  var n=$('skNote');
  if(n) n.innerHTML='โหลดข้อมูลไม่สำเร็จ ตรวจการเชื่อมต่ออินเทอร์เน็ต แล้วลองอีกครั้ง <button onclick="retry()">ลองใหม่</button>';
}
function retry(){ var n=$('skNote'); if(n) n.textContent='กำลังลองใหม่…'; load(true); }

/* ───── สร้างหน้า ───── */
function render(j){
  D=j; D.works=(D.works||[]).slice();
  var names=String(D.profile.owner_names||'').split(',').map(function(s){return s.trim();}).filter(Boolean);
  OWNER_RX=names.length?new RegExp('('+names.map(function(n){return esc(n).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}).join('|')+')','g'):null;
  TABS.forEach(function(t){ if(t.cats) t.items=D.works.filter(function(w){ return t.cats.indexOf(w.category)>=0; }); });

  $('app').innerHTML='<div class="wrap">'+profileCard()+
    '<section class="panel"><nav class="tabs" role="tablist" id="tabs">'+tabButtons()+'</nav><div id="view"></div></section></div>'+
    '<div id="print">'+printDoc()+'</div>';
  footer();
  jsonLd();
  route();
}
function tabButtons(){
  return TABS.filter(function(t){ return !t.cats||t.items.length; }).map(function(t){
    return '<button role="tab" id="tab-'+t.id+'" aria-controls="view" aria-selected="false" onclick="go(\''+t.id+'\')">'+esc(t.name)+
      (t.items?'<span class="c">'+t.items.length+'</span>':'')+'</button>';
  }).join('');
}
function go(id){ if(location.hash!=='#'+id) location.hash=id; else route(); }
var TAB_ALIAS={projects:'innovation',awards:'innovation'};   /* ลิงก์เดิมยังใช้ได้ */
function route(){
  var id=(location.hash||'').slice(1);
  if(TAB_ALIAS[id]){ id=TAB_ALIAS[id]; history.replaceState(null,'',location.pathname+location.search+'#'+id); }
  /* ลิงก์ตรงถึงผลงาน: #w-RMS-0010 → เปิดหมวดของผลงานนั้น แล้วเปิดรายละเอียด */
  if(/^w-[A-Za-z0-9-]+$/.test(id)){
    var w=findW(id.slice(2));
    /* เปิดจากลิงก์ตรง (หน้ายังไม่ได้แสดงแท็บใด) → แสดงแท็บของผลงานนั้น · เปิดจากในหน้า → คงแท็บเดิมไว้ด้านหลัง */
    if(w){ if(!CUR_TAB) showTab(tabOf(w)); showWork(w); return; }
    id='';
  }
  if(!$('dlg').hidden) hideWork();
  var t=TABS.filter(function(x){ return x.id===id&&(!x.cats||x.items.length); })[0]||TABS[0];
  showTab(t);
}
var CUR_TAB='';
function showTab(t){
  CUR_TAB=t.id;
  document.querySelectorAll('#tabs button').forEach(function(b){ b.setAttribute('aria-selected',b.id==='tab-'+t.id?'true':'false'); });
  $('view').innerHTML=t.id==='overview'?overview():t.id==='cv'?cvView():listView(t);
}
function findW(id){ return (D.works||[]).filter(function(x){ return x.id===id; })[0]; }
function tabOf(w){ return TABS.filter(function(t){ return t.cats&&t.cats.indexOf(w.category)>=0&&t.items.length; })[0]||TABS[0]; }
window.addEventListener('hashchange',function(){ if(D) route(); });

function profileCard(){
  var p=D.profile, pub=D.works.filter(function(w){return w.category==='ผลงานตีพิมพ์';});
  var photo=safeUrl(p.photo);
  var ph=photo?'<img class="ph" src="'+esc(photo)+'" alt="รูป '+esc(p.name_th)+'">':'<div class="ph" aria-hidden="true">'+esc((p.name_th||'?').replace(/^(นาย|นางสาว|นาง)/,'').charAt(0))+'</div>';

/*==================================================================
  เครื่องคำนวณความพร้อมขอกำหนดตำแหน่ง (ใช้ร่วมกันทั้งหน้าสาธารณะและหน้าผู้ดูแล — แก้ที่เดียวต้องแก้ทั้งสองไฟล์ให้ตรงกัน)
  - นับเฉพาะผลงานที่: เสร็จแล้ว · ไม่ถูกใช้/ไม่ถูกจองในการยื่นขออื่น · (ถ้าเกณฑ์กำหนด) หลักฐานการเผยแพร่ครบ
  - ขอข้ามระดับ: รวมเกณฑ์ทุกระดับระหว่างตำแหน่งปัจจุบันถึงตำแหน่งที่ขอ (สายเดียวกัน)
  - 1 ผลงานนับได้ 1 ข้อเกณฑ์ — ใช้ผลงานที่เลือกไว้ในการยื่นขอก่อน แล้วจัดให้ข้อที่มีตัวเลือกน้อยที่สุด
==================================================================*/
var RMS_DONE=['ตีพิมพ์แล้ว','เสร็จสิ้น','เผยแพร่แล้ว','ได้รับรางวัล'];
var RMS_APP_ACTIVE=['กำลังเตรียม','ยื่นแล้ว'], RMS_APP_USED=['ได้รับแต่งตั้ง'];
var RMS_BASE={'ทั่วไป':'ปฏิบัติงาน','วิชาชีพเฉพาะ':'ปฏิบัติการ'};
function rmsDone(w){ return RMS_DONE.indexOf(w.status)>=0; }
function rmsEvidence(w,evs,rule){
  if(!rule||!rule.cats||rule.cats.indexOf(w.category)<0) return {ok:true,applies:false};
  var L=(evs||[]).filter(function(e){ return e.workId===w.id; });
  var cert=function(e){ return !!(e.hasCert||e.certFile); };
  var cIn=L.filter(function(e){ return e.scope==='ภายในมหาวิทยาลัย'&&cert(e); }).length;
  var cOut=L.filter(function(e){ return e.scope!=='ภายในมหาวิทยาลัย'&&cert(e); }).length;
  var book=!!(w.bookFile&&w.bookFile.url);
  return {ok:(!rule.book||book)&&cIn>=rule.minIn&&cOut>=rule.minOut,applies:true,cIn:cIn,cOut:cOut,book:book};
}
/* สถานะการใช้ผลงาน: used = ใช้ขอตำแหน่งแล้ว (เลือกซ้ำไม่ได้) · active = กำลังใช้ในการยื่นขอ · '' = ว่าง
   rank = ระดับของ "ข้อเกณฑ์" ที่ผลงานนี้ใช้ตอบ (เช่น ยื่นข้ามระดับสู่ชำนาญการพิเศษ แต่คู่มือใช้ตอบเกณฑ์ชำนาญการ → rank = ชำนาญการ)
   appRank = ตำแหน่งที่ยื่นขอจริง */
function rmsUse(w,apps,exceptAppId){
  if(w.usedFor) return {state:'used',rank:w.usedFor,appRank:w.usedFor,year:w.usedYear,app:null,legacy:true};
  var hit=null;
  (apps||[]).forEach(function(a){
    if(a.id===exceptAppId) return;
    var pk=(a.picks||[]).filter(function(p){ return p.workId===w.id; })[0];
    if(!pk) return;
    var reqRank=String(pk.key||'').split('|')[0]||a.rank;
    if(RMS_APP_USED.indexOf(a.status)>=0) hit={state:'used',rank:reqRank,appRank:a.rank,year:String(a.resultDate||'').slice(0,4)?Number(String(a.resultDate).slice(0,4))+543:'',app:a};
    else if(RMS_APP_ACTIVE.indexOf(a.status)>=0&&!hit) hit={state:'active',rank:reqRank,appRank:a.rank,app:a};
  });
  return hit||{state:''};
}
/* ตำแหน่งที่ผลงานประเภทนี้ใช้ได้ตามเกณฑ์ (เช่น คู่มือปฏิบัติงาน → ชำนาญงาน/ชำนาญงานพิเศษ/ชำนาญการ) */
function rmsRanksFor(w,crit){
  return (crit||[]).filter(function(r){ return r.reqs.some(function(q){ return q.cats.indexOf(w.category)>=0&&(!q.levels||!q.levels.length||q.levels.indexOf(w.level)>=0); }); }).map(function(r){ return r.rank; });
}
/* สายงานของบุคลากร: ตั้งเองในข้อมูลส่วนตัว (career_track) หรืออนุมานจากตำแหน่งปัจจุบัน
   ปฏิบัติการ/ชำนาญการ/… → วิชาชีพเฉพาะ · ปฏิบัติงาน/ชำนาญงาน/… → ทั่วไป */
function rmsTrack(profile,current,crit){
  var t=String((profile&&profile.career_track)||'').trim();
  if(t) return t;
  for(var k in RMS_BASE) if(RMS_BASE[k]===current) return k;
  var r=(crit||[]).filter(function(x){ return x.rank===current; })[0];
  if(r&&r.track) return r.track;
  return 'วิชาชีพเฉพาะ';
}
/* เกณฑ์เฉพาะสายงานของบุคลากร (ถ้าเกณฑ์ไม่ได้กำหนด track ไว้เลย ใช้ทั้งหมด) */
function rmsTrackCrit(crit,track){
  var L=(crit||[]).filter(function(r){ return (r.track||'')===track; });
  return L.length?L:(crit||[]);
}
function rmsCurrentRank(hist,profile){
  var H=(hist||[]).filter(function(h){ return h.rank; }).slice().sort(function(a,b){ return String(a.startDate).localeCompare(String(b.startDate)); });
  return H.length?H[H.length-1].rank:((profile&&profile.current_rank)||'');
}
/* เส้นทางตำแหน่ง: ระดับถัดจากตำแหน่งปัจจุบันจนถึงตำแหน่งที่ขอ ในสายเดียวกัน */
function rmsPath(crit,current,target){
  var t=(crit||[]).filter(function(r){ return r.rank===target; })[0];
  if(!t) return [];
  var ranks=crit.filter(function(r){ return (r.track||'')===(t.track||''); });
  var ti=ranks.indexOf(t), ci=-1;
  ranks.forEach(function(r,i){ if(r.rank===current) ci=i; });
  if(ci>=ti) return [t];
  return ranks.slice(ci+1,ti+1);
}
function rmsActiveApp(apps,rank){
  return (apps||[]).filter(function(a){ return a.rank===rank&&RMS_APP_ACTIVE.indexOf(a.status)>=0; })[0]||null;
}
function rmsReadiness(works,evs,rule,crit,target,opts){
  opts=opts||{};
  var path=rmsPath(crit,opts.current||'',target);
  if(!path.length) return null;
  var app=opts.app!==undefined?opts.app:rmsActiveApp(opts.apps,target);
  var appId=app?app.id:'';
  var reqs=[];
  path.forEach(function(rk){ rk.reqs.forEach(function(q,i){ reqs.push({rank:rk.rank,key:rk.rank+'|'+i,i:reqs.length,q:q,min:Math.max(1,Number(q.min)||1),assigned:[]}); }); });
  reqs.forEach(function(r){
    var q=r.q, match=function(w){ return q.cats.indexOf(w.category)>=0&&(!q.levels||!q.levels.length||q.levels.indexOf(w.level)>=0); };
    var all=works.filter(match);
    r.locked=all.map(function(w){ return {w:w,use:rmsUse(w,opts.apps,appId)}; }).filter(function(x){ return x.use.state; });
    var pool=all.filter(function(w){ return !rmsUse(w,opts.apps,appId).state; });
    r.ready=pool.filter(function(w){ return rmsDone(w)&&(!q.evidence||rmsEvidence(w,evs,rule).ok); });
    r.pending=pool.filter(function(w){ return r.ready.indexOf(w)<0; }).map(function(w){
      return {w:w,why:!rmsDone(w)?('สถานะ: '+w.status):'หลักฐานการเผยแพร่ยังไม่ครบ'};
    });
  });
  var taken={};
  /* 1) ผลงานที่ผู้ใช้เลือกไว้ในการยื่นขอ */
  if(app) (app.picks||[]).forEach(function(p){
    var r=reqs.filter(function(x){ return x.key===p.key; })[0]; if(!r||taken[p.workId]) return;
    var w=r.ready.filter(function(x){ return x.id===p.workId; })[0];
    if(w&&r.assigned.length<r.min){ taken[w.id]=1; r.assigned.push(w); r.picked=true; }
  });
  /* 2) เติมอัตโนมัติ: ข้อที่มีตัวเลือกน้อย/เข้มงวดกว่าก่อน */
  reqs.slice().sort(function(a,b){ return (a.ready.length-b.ready.length)||(a.q.cats.length-b.q.cats.length)||((b.q.levels||[]).length?1:0)-((a.q.levels||[]).length?1:0); }).forEach(function(r){
    r.ready.forEach(function(w){ if(r.assigned.length<r.min&&!taken[w.id]){ taken[w.id]=1; r.assigned.push(w); } });
  });
  var need=0,have=0;
  reqs.forEach(function(r){
    r.met=r.assigned.length>=r.min; r.missing=Math.max(0,r.min-r.assigned.length);
    r.candidates=r.pending.filter(function(p){ return !taken[p.w.id]; });
    r.spare=r.ready.filter(function(w){ return !taken[w.id]; });
    need+=r.min; have+=Math.min(r.assigned.length,r.min);
  });
  return {rank:target,path:path.map(function(r){ return r.rank; }),skip:path.length>1,app:app,reqs:reqs,
    ok:reqs.every(function(r){return r.met;}),pct:need?have/need:0,missing:reqs.reduce(function(n,r){ return n+r.missing; },0)};
}

}

/* โดนัทตามประเภท */

/* หลักฐานการเผยแพร่ (คู่มือปฏิบัติงาน / ผลงานเชิงวิเคราะห์) */
function evList(id){ return (D.evidences||[]).filter(function(e){ return e.workId===id; }); }
function evidenceHtml(w){
  var r=D.evidenceRule||{cats:[]}, list=evList(w.id);
  if(r.cats.indexOf(w.category)<0&&!list.length) return '';
  var inn=list.filter(function(e){return e.scope==='ภายในมหาวิทยาลัย';}).length, out=list.length-inn;
  /* ผ่านเกณฑ์ = นับเฉพาะแห่งที่มีหนังสือรับรอง (เหมือนหน้าผู้ดูแล) */
  var cert=function(e){ return e.hasCert||!!e.certFile; };
  var cIn=list.filter(function(e){return e.scope==='ภายในมหาวิทยาลัย'&&cert(e);}).length, cOut=list.filter(function(e){return e.scope!=='ภายในมหาวิทยาลัย'&&cert(e);}).length;
  var met=cIn>=r.minIn&&cOut>=r.minOut&&(!r.book||(w.bookFile&&w.bookFile.url));
  var dt=function(d){ var x=new Date(d+'T00:00:00'); return d&&!isNaN(x)?x.toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'}):''; };
  return '<div class="evp"><div class="hd">การเผยแพร่: ภายในมหาวิทยาลัย '+inn+' แห่ง · ภายนอกมหาวิทยาลัย '+out+' แห่ง'+(met?'<span class="ok">✓ ครบตามเกณฑ์</span>':'')+'</div>'+
    (list.length?'<ul>'+list.map(function(e){
      var o=e.scope!=='ภายในมหาวิทยาลัย';
      return '<li><span class="sc'+(o?' out':'')+'">'+(o?'ภายนอก':'ภายใน')+'</span><span>'+esc(e.org)+'</span><small>'+esc([e.method,dt(e.date),e.refNo?('เลขที่ '+e.refNo):''].filter(Boolean).join(' · '))+'</small>'+
        (e.certFile&&safeUrl(e.certFile.url)?'<a href="'+esc(safeUrl(e.certFile.url))+'" target="_blank" rel="noopener">หนังสือรับรอง</a>':'')+'</li>';
    }).join('')+'</ul>':'')+'</div>';
}

/* ชนิดไฟล์จากชื่อ/ลิงก์ → ป้ายไอคอน + ดูตัวอย่างได้หรือไม่ */
function fileKind(url,name){
  var u=String(url||''), n=String(name||'');
  var drive=u.match(/drive\.google\.com\/file\/d\/([\w-]{20,})/);
  if(drive) return {lab:'DRIVE',col:'#1A73E8',host:'Google Drive',pv:'https://drive.google.com/file/d/'+drive[1]+'/preview',img:false};
  var gdoc=u.match(/docs\.google\.com\/(document|spreadsheets|presentation)\/d\/([\w-]{20,})/);
  if(gdoc) return {lab:'DOCS',col:'#1A73E8',host:'Google Docs',pv:'https://docs.google.com/'+gdoc[1]+'/d/'+gdoc[2]+'/preview',img:false};
  var ext=((n.match(/\.([a-z0-9]{2,5})$/i)||u.split('?')[0].match(/\.([a-z0-9]{2,5})$/i)||[])[1]||'').toLowerCase();
  var host=''; try{ host=new URL(u).hostname.replace(/^www\./,''); }catch(e){}
  if(host==='eng.msu.ac.th') host='เซิร์ฟเวอร์คณะวิศวกรรมศาสตร์ มมส.';
  if(ext==='pdf') return {lab:'PDF',col:'#C62828',host:host,pv:u,img:false};
  if(/^(jpe?g|png|gif|webp)$/.test(ext)) return {lab:ext.toUpperCase().replace('JPEG','JPG'),col:'#0B7A5B',host:host,pv:u,img:true};
  if(/^docx?$/.test(ext)) return {lab:'DOC',col:'#1565C0',host:host,pv:'',img:false};
  if(/^xlsx?$/.test(ext)) return {lab:'XLS',col:'#0B7A5B',host:host,pv:'',img:false};
  if(/^pptx?$/.test(ext)) return {lab:'PPT',col:'#C77700',host:host,pv:'',img:false};
  return {lab:'LINK',col:'#5E6B80',host:host,pv:'',img:false};
}
/* เอกสารทั้งหมดของผลงาน (ไม่รวมหนังสือรับรอง ซึ่งอยู่ในตารางหลักฐาน) */
function docsOf(w){
  var L=[];
  if(w.bookFile&&safeUrl(w.bookFile.url)) L.push({name:w.bookFile.name||'ไฟล์เล่มฉบับสมบูรณ์',url:w.bookFile.url,role:'ไฟล์เล่มฉบับสมบูรณ์',main:true});
  (w.files||[]).forEach(function(f){ if(safeUrl(f.url)) L.push({name:shortName(f.name),url:f.url,role:'เอกสารประกอบ'}); });
  return L;
}

    '<div class="doc-tx"><b>'+esc(d.name)+'</b><small>'+esc(d.role)+(k.host?' · '+esc(k.host):'')+'</small><small class="url" style="display:none">'+esc(d.url)+'</small></div>'+
    '<div class="doc-act">'+(k.pv?'<button type="button" aria-expanded="false" aria-controls="pv-'+key+'" onclick="togglePv(this,\''+key+'\')">ดูตัวอย่าง</button>':'')+

/* โหลดตัวอย่างเมื่อกดเท่านั้น (ไฟล์เล่มอาจใหญ่หลาย MB) */
function togglePv(btn,key){

      '<div class="hint">ถ้าตัวอย่างไม่แสดง ให้กด “เปิดไฟล์ ↗” · ไฟล์บน Google Drive ต้องตั้งค่าแชร์เป็น “ทุกคนที่มีลิงก์”</div>';
  }
  box.hidden=!open; btn.setAttribute('aria-expanded',open?'true':'false'); btn.textContent=open?'ซ่อนตัวอย่าง':'ดูตัวอย่าง';

function showWork(w){
  if($('dlg').hidden) LAST_FOCUS=document.activeElement;
  var c=cls(w), done=isDone(w), docs=docsOf(w), ev=evList(w.id), r=D.evidenceRule||{cats:[]};

  var yearLbl=w.category==='ผลงานตีพิมพ์'?'ปีที่ตีพิมพ์':(r.cats.indexOf(w.category)>=0?'ปีที่จัดทำ/เผยแพร่':'ปี');
  var h='<div class="dlg-hd"><span class="rule" style="background:'+LEVEL_COLOR[c]+'"></span>'+
    '<div class="badges">'+(w.level?'<span class="lv '+c+'">'+esc(w.level)+'</span>':'')+'<span class="st '+(done?'ok':'wip')+'">'+esc(w.status)+'</span>'+
      '<span>'+esc(w.category)+'</span>'+(w.fiscalYear?'<span>ปีงบประมาณ '+esc(w.fiscalYear)+'</span>':'')+'</div>'+
    (LIST_CTX&&LISTS[LIST_CTX]?'':'')+
    '<h2 id="dlgTitle">'+esc(w.title)+'</h2>'+(w.titleEn?'<div class="en">'+esc(w.titleEn)+'</div>':'')+
    '<button class="dlg-x" type="button" onclick="closeWork()" aria-label="ปิดรายละเอียด">×</button></div><div class="dlg-bd">';
  if(LIST_CTX&&LISTS[LIST_CTX]) h=h.replace('<div class="badges">','<button class="dlg-back" type="button" onclick="backToList()">‹ กลับไปรายการ: '+esc(LISTS[LIST_CTX].title)+'</button><div class="badges">');
  /* 1) ข้อมูลผลงาน */
  h+='<section class="dsec"><h3>ข้อมูลผลงาน</h3><dl class="kvg">'+
    kv('ผู้แต่ง/คณะผู้จัดทำ',w.authors?authorsHtml(w.authors):'')+
    kv('บทบาทของเจ้าของผลงาน',esc(w.role))+
    kv(w.category==='โครงการวิจัย'?'แหล่งทุน':(w.category==='ผลงานตีพิมพ์'?'วารสาร/การประชุม':'หน่วยงาน/แหล่งเผยแพร่'),esc(w.source))+
    kv('ปีที่ ฉบับที่ หน้า/รายละเอียด',esc(w.detail))+
    kv(yearLbl,w.year?'พ.ศ. '+esc(w.year):'')+
    kv('ปีงบประมาณ',w.fiscalYear?esc(w.fiscalYear):'')+
    kv('ระดับ',esc(w.level))+kv('สถานะ',esc(w.status))+
    kv('การใช้ขอกำหนดตำแหน่ง',(function(){ var u=rmsUse(w,D.apps); var via=u.appRank&&u.appRank!==u.rank?' (ยื่นข้ามระดับสู่'+esc(u.appRank)+')':''; return u.state==='used'?'ใช้เป็นหลักฐานตามเกณฑ์ระดับ<b> '+esc(u.rank)+'</b>'+via+(u.year?' พ.ศ. '+esc(u.year):'')+' แล้ว — นำมาใช้ซ้ำไม่ได้':(u.state==='active'?'กำลังใช้เป็นหลักฐานตามเกณฑ์ระดับ<b> '+esc(u.rank)+'</b>'+via+' ('+esc(u.app.status)+')':''); })())+
    kv('ลิงก์ผลงาน (DOI/ThaiJO)',safeUrl(w.url)?'<a href="'+esc(safeUrl(w.url))+'" target="_blank" rel="noopener">'+esc(w.url)+'</a>':'')+
    '</dl></section>';
  /* 2) บทคัดย่อ */
  if(w.abstract||w.keywords){
    h+='<section class="dsec"><h3>บทคัดย่อ</h3>'+(w.abstract?'<p class="abs">'+esc(w.abstract)+'</p>':'')+
      (w.keywords?'<div class="kw">'+String(w.keywords).split(/\s*[,;]\s*/).filter(Boolean).map(function(k){ return '<span>'+esc(k)+'</span>'; }).join('')+'</div>':'')+'</section>';
  }
  /* 3) เอกสาร */
  h+='<section class="dsec"><h3>เอกสารผลงาน <span class="n">'+docs.length+'</span></h3>'+
    (docs.length?'<div class="docs">'+docs.map(function(d,i){ return docRow(d,'d'+i); }).join('')+'</div>':'<p class="lead" style="margin:0">ยังไม่มีเอกสารที่เผยแพร่</p>')+'</section>';
  /* 4) หลักฐานการเผยแพร่ */
  if(needEv){
    var cert=function(e){ return e.hasCert||!!e.certFile; };
    var cIn=ev.filter(function(e){return e.scope==='ภายในมหาวิทยาลัย'&&cert(e);}).length, cOut=ev.filter(function(e){return e.scope!=='ภายในมหาวิทยาลัย'&&cert(e);}).length;
    var book=!!(w.bookFile&&w.bookFile.url);
    var chip=function(ok,t){ return '<span class="'+(ok?'y':'n')+'">'+(ok?'✓ ':'')+t+'</span>'; };
    h+='<section class="dsec"><h3>หลักฐานการเผยแพร่ <span class="n">'+ev.length+' แห่ง</span></h3>';
    if(r.cats.indexOf(w.category)>=0) h+='<div class="crit">'+(r.book?chip(book,'ไฟล์เล่มฉบับสมบูรณ์'):'')+chip(cIn>=r.minIn,'ภายในมหาวิทยาลัย '+cIn+'/'+r.minIn+' แห่ง')+chip(cOut>=r.minOut,'ภายนอกมหาวิทยาลัย '+cOut+'/'+r.minOut+' แห่ง')+'</div>';
    if(ev.length){
      var dt=function(d){ var x=new Date(d+'T00:00:00'); return d&&!isNaN(x)?x.toLocaleDateString('th-TH',{day:'numeric',month:'long',year:'numeric'}):'-'; };
      h+='<div class="tbl"><table class="evt"><thead><tr><th>ขอบเขต</th><th>หน่วยงานที่รับเผยแพร่</th><th>วิธีเผยแพร่</th><th>วันที่</th><th>เลขที่หนังสือ</th><th>หนังสือรับรอง</th></tr></thead><tbody>'+
        ev.map(function(e,i){
          var o=e.scope!=='ภายในมหาวิทยาลัย', k=e.certFile?fileKind(e.certFile.url,e.certFile.name):null, key='e'+i;
          var certCell=e.certFile&&safeUrl(e.certFile.url)?'<div class="doc-act">'+(k.pv?'<button type="button" aria-expanded="false" aria-controls="pv-'+key+'" onclick="togglePv(this,\''+key+'\')">ดูตัวอย่าง</button>':'')+'<a href="'+esc(safeUrl(e.certFile.url))+'" target="_blank" rel="noopener">เปิด ↗</a></div>':(e.hasCert?'<small class="lead">มีหนังสือรับรอง (ไม่เผยแพร่ไฟล์)</small>':'<small class="lead">-</small>');
          return '<tr><td><span class="sc'+(o?' out':'')+'">'+(o?'ภายนอก':'ภายใน มมส.')+'</span></td><td>'+esc(e.org)+'</td><td>'+esc(e.method||'-')+'</td><td>'+dt(e.date)+'</td><td>'+esc(e.refNo||'-')+'</td><td>'+certCell+'</td></tr>'+
            (k&&k.pv?'<tr class="pvrow"><td colspan="6"><div class="pv" id="pv-'+key+'" hidden data-src="'+esc(k.pv)+'" data-img="'+(k.img?1:0)+'"></div></td></tr>':'');
        }).join('')+'</tbody></table></div>';
    } else h+='<p class="lead" style="margin:0">ยังไม่มีรายการเผยแพร่</p>';
    h+='</section>';
  }
  /* 5) การอ้างอิง */
  h+='<section class="dsec"><h3>การอ้างอิง</h3><div class="cite-box">'+esc(citeText(w))+'</div></section></div>';
  h+='<div class="dlg-ft"><small class="grow">ปรับปรุงล่าสุด '+(w.updated?esc(thDate(w.updated)):'-')+'</small>'+
    '<button type="button" onclick="cite(\''+esc(w.id)+'\')">คัดลอกการอ้างอิง</button>'+
    '<button type="button" onclick="copy(pageUrl()+\'#w-'+esc(w.id)+'\',\'คัดลอกลิงก์ผลงานนี้แล้ว\')">คัดลอกลิงก์ผลงานนี้</button>'+
    '<button type="button" onclick="printWork()">พิมพ์ผลงานนี้</button>'+
    '<button type="button" onclick="closeWork()">ปิด</button></div>';
  $('dlgBox').innerHTML=h;
  $('dlg').hidden=false; document.body.classList.add('dlg-open');
  $('dlg').scrollTop=0; $('dlgBox').focus();
  document.title=w.title+' · ผลงานวิชาการ · '+(D.profile.name_th||'');
}
function printWork(){ document.body.classList.add('print-one'); window.print(); setTimeout(function(){ document.body.classList.remove('print-one'); },500); }
window.addEventListener('afterprint',function(){ document.body.classList.remove('print-one'); });

function shortName(n){
  n=String(n||'ไฟล์').replace(/^RMS-[A-Z0-9]+\s+\d{8}-\d{6}(-\d+)?\s+/,'');   // ตัดเลขที่และเวลาที่ระบบเติมหน้าชื่อไฟล์
  return n.length>40?n.slice(0,37)+'…':n;
}
function citeText(w){
  return [w.authors, w.year?'('+w.year+')':'', w.title+(w.titleEn?' ['+w.titleEn+']':''), [w.source,w.detail].filter(Boolean).join(', '), safeUrl(w.url)]
    .filter(Boolean).join('. ').replace(/\.\./g,'.');
}
function cite(id){
  var w=D.works.filter(function(x){return x.id===id;})[0]; if(!w) return;
  copy(citeText(w),'คัดลอกการอ้างอิงแล้ว');
}
function copy(text,msg){
  (navigator.clipboard?navigator.clipboard.writeText(text):Promise.reject()).then(function(){ toast(msg); })
    .catch(function(){ var t=document.createElement('textarea'); t.value=text; document.body.appendChild(t); t.select();
      try{ document.execCommand('copy'); toast(msg); }catch(e){} document.body.removeChild(t); });
}
function copyLink(){ copy(pageUrl()+(location.hash||''),'คัดลอกลิงก์แล้ว'); }

/* ประวัติ */
function cvView(){
  var p=D.profile, lines=function(s){ return String(s||'').split(/\n+/).map(function(x){return x.trim();}).filter(Boolean); };
  /* แยก "พ.ศ. 2550–2556 รายละเอียด" → ป้ายปี + ข้อความ เพื่อแสดงเป็นเส้นเวลา */
  var split=function(x){
    var m=x.match(/^(?:พ\.ศ\.\s*)?((?:25|26)\d\d(?:\s*[–\-]\s*(?:(?:25|26)\d\d|ปัจจุบัน))?)\s+(.+)$/);
    if(m) return {y:m[1].replace(/\s+/g,''),t:m[2]};
    var d=x.match(/^(ตั้งแต่[^\d]*\d{1,2}\s*\S+\s*((?:25|26)\d\d))\s*(.+)$/);
    if(d) return {y:'ตั้งแต่ '+d[2],t:d[3]};
    return {y:'',t:x};
  };
  var tl=function(arr){ return '<ol class="tl">'+arr.map(function(it){ return '<li><span class="tl-y">'+(it.y?esc(it.y):'•')+'</span><div class="tl-t">'+it.t+'</div></li>'; }).join('')+'</ol>'; };
  var ed=lines(p.education).map(split), wk=lines(p.work_history).map(split);
  var H=(D.history||[]).slice().sort(function(a,b){ return String(b.startDate).localeCompare(String(a.startDate)); });
  var tags=String(p.expertise||'').split(',').map(function(x){return x.trim();}).filter(Boolean);
  var h='<div class="sec cv">';
  h+='<section class="cv-bio"><h2>ประวัติโดยย่อ</h2>'+(p.bio?'<div class="cv-prose">'+esc(p.bio).split(/\n{2,}/).map(function(par){ return '<p>'+par+'</p>'; }).join('')+'</div>':'<p class="lead">ยังไม่ได้กรอกประวัติโดยย่อ</p>')+
    (tags.length?'<div class="cv-tags">'+tags.map(function(x){ return '<span>'+esc(x)+'</span>'; }).join('')+'</div>':'')+'</section>';
  var left='', right='';
  if(H.length) left+='<section class="cv-card"><h3><span class="ci" style="--c:#0D2B5C"></span>ประวัติการดำรงตำแหน่ง</h3>'+tl(H.map(function(x,i){ return {y:x.startDate?thD(x.startDate):'',t:'<b>'+esc(x.rank)+'</b>'+(i===0?' <span class="cv-now">ปัจจุบัน</span>':'')}; }))+'</section>';
  if(ed.length) left+='<section class="cv-card"><h3><span class="ci" style="--c:#7C3AED"></span>ประวัติการศึกษา</h3>'+tl(ed.map(function(x){ return {y:x.y,t:esc(x.t)}; }))+'</section>';
  if(wk.length) right+='<section class="cv-card"><h3><span class="ci" style="--c:#0B7A5B"></span>ประวัติการทำงาน</h3>'+tl(wk.map(function(x){ return {y:x.y,t:esc(x.t)}; }))+'</section>';
  if(left||right) h+='<div class="cv-grid"><div class="cv-col">'+left+'</div><div class="cv-col">'+right+'</div></div>';
  return h+'</div>';
}

/* เอกสารสำหรับพิมพ์ — รวมผลงานทุกหมวด เรียงแบบประวัติผลงาน */
function printDoc(){
  var p=D.profile, h='';
  if(p.bio) h+='<h2>ประวัติโดยย่อ</h2><p class="prose">'+esc(p.bio)+'</p>';
  TABS.forEach(function(t){
    if(!t.cats||!t.items.length) return;
    h+='<h2>'+esc(t.name)+'</h2><ol>'+t.items.map(function(w){
      var ev=evList(w.id), inn=ev.filter(function(e){return e.scope==='ภายในมหาวิทยาลัย';});
      var evTxt=ev.length?'<br><small>เผยแพร่ภายใน '+inn.length+' แห่ง ('+esc(inn.map(function(e){return e.org;}).join(', '))+') · ภายนอก '+(ev.length-inn.length)+' แห่ง ('+esc(ev.filter(function(e){return e.scope!=='ภายในมหาวิทยาลัย';}).map(function(e){return e.org;}).join(', '))+')</small>':'';
      return '<li>'+esc(citeText(w))+' <i>['+esc([w.level,w.status].filter(Boolean).join(' · '))+']</i>'+evTxt+'</li>';
    }).join('')+'</ol>';
  });
  return h;
}

/* ท้ายหน้า + ข้อมูลโครงสร้างสำหรับเครื่องมือค้นหา */
function footer(){
  $('foot').hidden=false;
}
function latestUpdate(){
  var t=0; D.works.forEach(function(w){ var x=Date.parse(w.updated); if(x>t) t=x; });
  return t?new Date(t).toISOString():D.generated;
}
function jsonLd(){
  var p=D.profile;
  var data={'@context':'https://schema.org','@type':'Person',name:p.name_th,alternateName:p.name_en||undefined,jobTitle:p.position,
    email:p.email?'mailto:'+p.email:undefined,url:pageUrl(),
    affiliation:{'@type':'CollegeOrUniversity',name:'คณะวิศวกรรมศาสตร์ มหาวิทยาลัยมหาสารคาม',url:'https://eng.msu.ac.th'},
    sameAs:['github','orcid','scholar','thaijo','scopus','researchgate','linkedin','youtube','website'].map(function(k){return safeUrl(p[k]);}).filter(Boolean)};
  var s=document.createElement('script'); s.type='application/ld+json'; s.textContent=JSON.stringify(data);
  document.head.appendChild(s);
}

$('adminBtn').href=CONFIG.ADMIN;
load();
